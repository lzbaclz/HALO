<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <radialGradient id="halo-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#ef476f"/>
      <stop offset="100%" stop-color="#073b4c"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#073b4c"/>
      <stop offset="100%" stop-color="#118ab2"/>
    </linearGradient>
  </defs>

  <!-- halo rings -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="60" cy="60" rx="48" ry="14" stroke="url(#halo-grad)" stroke-width="3" opacity="0.55"/>
    <ellipse cx="60" cy="60" rx="40" ry="10" stroke="url(#halo-grad)" stroke-width="3" opacity="0.75"/>
    <ellipse cx="60" cy="60" rx="32" ry="6"  stroke="url(#halo-grad)" stroke-width="3"/>
  </g>
  <!-- GPU core -->
  <circle cx="60" cy="60" r="10" fill="url(#halo-grad)"/>

  <!-- wordmark -->
  <text x="120" y="58" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" fill="url(#text-grad)" letter-spacing="2">HALO</text>
  <text x="121" y="84" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="500" fill="#118ab2" letter-spacing="0.6">
    HOT-COLD ATTENTION-DRIVEN LOSSLESS OFFLOADING
  </text>
</svg>
