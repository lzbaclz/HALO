# Sandbox-safe CPU CI for HALO.
#
# Runs the 109 sandbox-safe pytest tests on every push / PR. Excludes:
#  - tests/test_integration_identity.py (needs CUDA + cached Qwen/Llama
#    7B checkpoints; a single test that brings the count to 119 on a
#    GPU host with checkpoints).
#  - tests/test_triton_chunked.py (needs CUDA + Triton; 9 tests that
#    bring the count to 118 with Triton but without checkpoints).
#
# The full 119-test run is left to local execution on a GPU host with
# the checkpoints cached at /public/model_zoo or pointed to via
# HALO_MODEL_ZOO.
name: ci-cpu-sandbox

on:
  push:
    branches: [main]
    paths:
      - 'halo/**'
      - 'baselines/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-cpu.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only)
        run: |
          python -m pip install --upgrade pip
          # The CPU CI installs the CPU build of torch to keep the runner
          # within the 14 GB free-tier disk quota; transformers / numpy /
          # the dev extras are picked up by `pip install -e .[dev]`.
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify HALO importable
        run: |
          python -c "import halo; print(halo.__version__)"
          python -c "from halo import HALOConfig, wrap_with_halo, HALOCacheChunked"

      - name: Run sandbox-safe pytest (109 tests)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          pytest tests/ -q \
            --ignore=tests/test_integration_identity.py \
            --ignore=tests/test_triton_chunked.py

      - name: Check claimed test count
        run: |
          # CI/CD smoke: the README and the appendix both claim 109
          # sandbox-safe tests. Fail loudly if a test was added/removed
          # without updating those claims.
          collected=$(pytest tests/ --collect-only -q \
            --ignore=tests/test_integration_identity.py \
            --ignore=tests/test_triton_chunked.py 2>&1 \
            | grep -oE '[0-9]+ tests collected' \
            | grep -oE '[0-9]+')
          if [ "$collected" != "109" ]; then
            echo "ERROR: collected $collected sandbox-safe tests, expected 109."
            echo "Either update the test list intentionally and then bump"
            echo "the claim in README.md (line 79) and paper/sections/A_appendix.tex"
            echo "(the '109 sandbox-safe' paragraph), or revert."
            exit 1
          fi
          echo "OK: 109 sandbox-safe tests collected, matches README + appendix claim."
